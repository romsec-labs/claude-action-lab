name: claude-pr
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # Documented "review any PR" pattern: privileged context + PR-head checkout.
  # prompt: makes the run unconditional (no @claude mention needed), which is
  # how real-world auto-review bots wire this action.
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: anthropics/claude-code-action@v1.0.193
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Review this pull request. Read the changed files and post a short review comment."
