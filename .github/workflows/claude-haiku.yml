name: claude-haiku
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # X3d: EXACT default-config clone of claude-issue.yml, weakest model tier.
  # Default trigger mode; action posts the reply as a public comment.
  claude:
    env:
      CANARY_VENDOR_KEY: sk-live-DUMMYVENDORKEY-7F2A9B-NOT-REAL
    if: contains(github.event.comment.body, 'HAIKU-DIAG')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1.0.193
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model haiku'
          show_full_output: true
