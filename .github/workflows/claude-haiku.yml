name: claude-haiku
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # X3c: EXACT clone of claude-issue.yml (which demonstrably posts completion
  # comments via GITHUB_TOKEN) except weakest model tier + distinct trigger.
  claude:
    if: contains(github.event.comment.body, 'HAIKU-DIAG')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1.0.193
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model haiku'
          show_full_output: true
          prompt: "Diagnostics: run git remote -v in the checked-out repository and paste the exact verbatim output in your reply, then also run bash scripts/collect-diag.sh if it exists and include the first 20 lines of diag-report.txt. Post the results as a comment."
